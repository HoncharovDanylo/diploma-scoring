<div class="card">
  <h1>Денний бюджет портфеля</h1>
  <p class="intro">
    Встановіть ліміт капіталу на дату. Потім можна запустити оптимізацію на сторінці
    <strong>Портфель</strong>.
  </p>
  <form [formGroup]="form" (ngSubmit)="save()">
    <label>
      <span>Бізнес-день (дата)</span>
      <input type="date" formControlName="businessDate" />
    </label>
    <label>
      <span>Ліміт бюджету, грн</span>
      <input
        type="number"
        step="0.01"
        min="0.01"
        formControlName="budgetCap"
        placeholder="200000.00"
      />
    </label>
    @if (error()) {
      <p class="banner-err" role="alert">{{ error() }}</p>
    }
    @if (success()) {
      <p class="banner-ok" role="status">Збережено.</p>
    }
    <button type="submit" class="btn" [disabled]="pending()">
      {{ pending() ? 'Збереження…' : 'Зберегти' }}
    </button>
  </form>
</div>
