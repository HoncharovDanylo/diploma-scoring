[project]
name = "lending-analytics"
version = "0.2.0"
description = "XGBoost + SHAP scoring and GA portfolio optimization workers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aio-pika>=9.4.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.2.0",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "scikit-learn>=1.3.0",
  "xgboost>=2.0.0",
  "shap>=0.44.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
